name: Release Validation
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read

jobs:
  validation:
    name: Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate marketing version
        run: |
          # The app version lives in the Xcode project (there is no package.json).
          versions=$(grep -E '^\s*MARKETING_VERSION = [0-9]+\.[0-9]+\.[0-9]+;' InstantNX.xcodeproj/project.pbxproj \
            | sed -E 's/.*= ([0-9.]+);/\1/' | sort -u)
          if [ "$(printf '%s\n' "$versions" | wc -l)" != 1 ]; then
            echo "::error::The app target configurations disagree on MARKETING_VERSION: $versions"
            exit 1
          fi
          latest=$(git tag --list 'v[0-9]*' | sed 's/^v//' | sort -V | tail -n 1)
          echo "project version: $versions, latest tag: ${latest:-none}"
          if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "$versions" | sort -V | tail -n 1)" != "$versions" ]; then
            echo "::error::MARKETING_VERSION $versions is older than the latest release tag v$latest"
            exit 1
          fi
          if [ "$versions" = "${latest:-}" ]; then
            echo "::error::MARKETING_VERSION $versions was already released as v$latest; bump it"
            exit 1
          fi
